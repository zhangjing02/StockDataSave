name: Daily Stock Data Update (CZSC Format)

on:
  schedule:
    # 每天美东时间晚上 17:00 运行 (相当于 UTC 21:00) 确保美股已收盘
    - cron: '0 22 * * 1-5'
  workflow_dispatch:
    # 允许手动触发
    inputs:
      manual_trigger:
        description: 'Manual Trigger'
        required: false

jobs:
  update-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip' # 启用 pip 缓存，大幅加速后续依赖安装

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Fetch stock data
        env:
          TIINGO_API_KEY: ${{ secrets.TIINGO_API_KEY }}
        run: python us_data_fetcher.py

      - name: Run CZSC Analysis
        run: python run_czsc_analysis.py

      - name: Fetch news
        run: python news_fetcher.py

      - name: Commit and push to data-sync branch
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          # 1. 备份数据文件夹到临时目录
          echo "Backing up generated data..."
          mkdir -p /tmp/data_backup
          cp -r data/* /tmp/data_backup/
          
          # 2. 切换到数据分支 (由于 main 分支 ignore 了 data/，checkout 可能会清理未追踪文件)
          echo "Switching to data-sync branch..."
          git checkout -B data-sync
          
          # 3. 还原数据文件夹
          echo "Restoring data..."
          mkdir -p data
          cp -r /tmp/data_backup/* data/
          
          # 4. 调试：列出数据目录内容确认
          echo "Contents of data/ to be committed:"
          ls -R data/ | head -n 100
          
          # 5. 强制添加并提交
          git add -f data/
          
          # 检查变更
          echo "Git status after add:"
          git status
          
          git commit -m "Auto-update: data & signals $(date -u +%Y-%m-%dT%H:%M:%SZ)" || echo "No changes to commit"
          
          # 6. 强制推送到远程
          git push origin data-sync --force

