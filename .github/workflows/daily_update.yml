name: Daily Stock Data Update (CZSC Format)

on:
  schedule:
    # 每天美东时间晚上 17:00 运行（冬令时 UTC22 / 夏令时 UTC21，当前配置固定 UTC22）
    - cron: '0 22 * * 1-5'
  workflow_dispatch:
    # 允许手动触发
    inputs:
      manual_trigger:
        description: 'Manual Trigger'
        required: false

concurrency:
  group: stock-data-daily-update
  cancel-in-progress: true

jobs:
  update-data:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip' # 启用 pip 缓存，大幅加速后续依赖安装

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Fetch stock data
        env:
          TIINGO_API_KEY: ${{ secrets.TIINGO_API_KEY }}
        run: python us_data_fetcher.py --force

      - name: Run CZSC Analysis
        run: python run_czsc_analysis.py

      - name: Fetch news
        run: python news_fetcher.py

      - name: Commit and push to data-sync branch
        run: |
          set -euo pipefail
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          # 1. 备份数据文件夹到临时目录
          echo "Backing up generated data..."
          mkdir -p /tmp/data_backup
          if [ -n "$(find data -mindepth 1 -print -quit 2>/dev/null || true)" ]; then
            cp -a data/. /tmp/data_backup/
          else
            echo "No generated data found under data/, continue with empty backup."
          fi
          
          # 2. 切换到数据分支 (由于 main 分支 ignore 了 data/，checkout 可能会清理未追踪文件)
          echo "Switching to data-sync branch..."
          git checkout -B data-sync
          
          # 3. 还原数据文件夹
          echo "Restoring data..."
          mkdir -p data
          if [ -n "$(find /tmp/data_backup -mindepth 1 -print -quit 2>/dev/null || true)" ]; then
            cp -a /tmp/data_backup/. data/
          else
            echo "Backup is empty, nothing to restore."
          fi
          
          # 4. 调试：列出数据目录内容确认
          echo "Contents of data/ to be committed:"
          ls -R data/
          
          # 5. 强制添加并提交
          if [ -n "$(find data -type f -print -quit 2>/dev/null || true)" ]; then
            git add -f data/
          else
            echo "No files under data/, skip git add."
          fi
          
          # 检查变更
          echo "Git status after add:"
          git status
          
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Auto-update: data & signals $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          fi
          
          # 6. 强制推送到远程
          git push origin data-sync --force

